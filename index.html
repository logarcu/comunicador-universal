<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="only light">
    <title>Comunicador</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0f0f0">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        
        html, body { 
            margin: 0; padding: 0; height: 100vh; height: 100dvh; 
            background-color: #f0f0f0 !important; color: #000000 !important;
            overflow: hidden; color-scheme: light;
        }

        #main-menu {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; width: 100%; gap: 3vh; padding: 4vh 4vw;
            background-color: #f0f0f0 !important;
        }

        .menu-btn {
            flex: 1; width: 100%; max-width: 800px;
            background: #ffffff !important; border: 6px solid #333 !important; border-radius: 25px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 5vh; font-weight: bold; color: #333 !important; cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); transition: transform 0.2s, background 0.3s;
            text-align: center; min-height: 15vh;
        }
        .menu-btn.small {
            flex: 0.5; font-size: 3vh; min-height: 10vh; border-width: 4px !important;
            background: #e3f2fd !important;
        }
        .menu-btn span { font-size: 2.5vh; font-weight: normal; color: #666 !important; margin-top: 1vh; }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn:focus { outline: 8px solid #00AAFF; transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 170, 255, 0.6); }

        #app-container {
            display: none; flex-direction: column; justify-content: space-between;
            height: 100vh; height: 100dvh; width: 100%; padding: 1vh 2vw;
            background-color: #f0f0f0 !important; cursor: pointer;
        }

        .row { display: flex; justify-content: space-evenly; align-items: center; width: 100%; gap: 2vw; flex: 1; max-height: 27vh; }
        
        .block { 
            border-width: 1.2vmin; border-style: solid; border-radius: 16px; 
            width: 29vmin; height: 29vmin; background-color: #ffffff !important; 
            display: flex; align-items: center; justify-content: center; 
            padding: 2px; position: relative; overflow: hidden; flex-shrink: 0; 
            transition: transform 0.2s, background-color 0.3s, outline 0.1s;
        }
        
        .block:focus, .btn:focus, .text-box:focus { outline: 6px solid #00AAFF; transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 170, 255, 0.6); }
        .block:active { transform: scale(0.95); }

        .b-blue { border-color: #0033CC !important; }
        .b-yellow { border-color: #CCCC00 !important; }
        .b-white { border-color: #888888 !important; box-shadow: 0 0 0 3px #000, inset 0 0 0 3px #000; } 
        .b-green { border-color: #008000 !important; }
        .b-black { border-color: #000000 !important; }
        .b-red { border-color: #CC0000 !important; }

        .c-blue { color: #0033CC !important; }
        .c-yellow { color: #999900 !important; text-shadow: 1px 1px 1px #fff; }
        .c-white { color: #555555 !important; text-shadow: 1px 1px 1px #fff; }
        .c-green { color: #008000 !important; }
        .c-black { color: #000000 !important; }
        .c-red { color: #CC0000 !important; }

        .letters { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; pointer-events: none; }
        .letters td { font-size: 7.5vmin; line-height: 1; font-weight: bold; text-align: center; vertical-align: middle; }
        .single-letter { font-size: 18vmin; font-weight: bold; pointer-events: none; }

        .text-container { display: flex; justify-content: center; align-items: center; height: 9vh; width: 100%; margin: 0.5vh 0; flex-shrink: 0; }
        .text-box {
            width: 90%; height: 100%; font-size: 5vh; padding: 0 20px;
            border: 3px solid #333 !important; border-radius: 12px; 
            background: #ffffff !important; color: #000000 !important;
            display: flex; align-items: center; justify-content: flex-end;
            overflow: hidden; white-space: pre; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.1); transition: all 0.3s;
        }
        
        .controls { display: flex; justify-content: space-evenly; gap: 2vw; height: 11vh; width: 100%; flex-shrink: 0; margin-bottom: 0.5vh; }
        .btn {
            flex: 1; border: 3px solid #333 !important; border-radius: 12px; 
            background: #ffffff !important; color: #000000 !important;
            display: flex; justify-content: center; align-items: center; font-size: 6.5vh;
            cursor: pointer; transition: all 0.3s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-delete { color: #CC0000 !important; }
        .btn-space { color: #000000 !important; }
        .btn-accept { color: #008000 !important; font-weight: bold; }

        .scanning-active { background-color: #ffeb3b !important; border-color: #ff9800 !important; transform: scale(1.02); box-shadow: 0 0 15px rgba(255, 152, 0, 0.8); }
        .highlighted { background-color: #ffeb3b !important; border-color: #ff9800 !important; }

        #status-msg {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: #222; color: #fff; padding: 12px 20px; border-radius: 8px;
            font-size: 16px; z-index: 9999; text-align: center; font-weight: bold;
        }
        #webcam-video { display: none; }
        
        @keyframes blink { 50% { opacity: 0; } }
        .blink-text { animation: blink 1.2s step-start infinite; color: #999 !important; }

        @media (prefers-color-scheme: dark) {
            html, body, #main-menu, #app-container { background-color: #f0f0f0 !important; color: #000000 !important; }
            .block, .menu-btn, .text-box, .btn { background-color: #ffffff !important; color: #000000 !important; border-color: #333333 !important; }
            .b-blue { border-color: #0033CC !important; }
            .b-yellow { border-color: #CCCC00 !important; }
            .b-white { border-color: #888888 !important; }
            .b-green { border-color: #008000 !important; }
            .b-black { border-color: #000000 !important; }
            .b-red { border-color: #CC0000 !important; }
            .btn-delete { color: #CC0000 !important; }
            .btn-space { color: #000000 !important; }
            .btn-accept { color: #008000 !important; }
            .menu-btn span { color: #666666 !important; }
        }
    </style>
</head>
<body>

    <div id="main-menu">
        <div class="menu-btn" tabindex="0" onclick="attemptStartApp('MANUAL')">
            Modo MANUAL<span>(Tocar pantalla o Ratón)</span>
        </div>
        <div class="menu-btn" tabindex="0" onclick="attemptStartApp('SECUENCIAL')">
            Modo SECUENCIAL<span>(Cámara o Pulsador global)</span>
        </div>
        <div class="menu-btn" tabindex="0" onclick="attemptStartApp('TV')">
            Modo TELEVISIÓN<span>(Mando a distancia con flechas)</span>
        </div>
        <div class="menu-btn small" tabindex="0" onclick="document.getElementById('file-input').click()">
            + Cargar Diccionario Local (.json)
        </div>
        <input type="file" id="file-input" style="display:none" accept=".json" onchange="loadLocalDictionary(event)">
    </div>

    <div id="app-container">
        <div id="status-msg" style="display:none;"></div>
        <video id="webcam-video" autoplay playsinline></video>

        <div class="row">
            <div class="block b-blue" id="b-blue" tabindex="0" onclick="handleItemClick(event, 'b-blue')"></div>
            <div class="block b-yellow" id="b-yellow" tabindex="0" onclick="handleItemClick(event, 'b-yellow')"></div>
            <div class="block b-white" id="b-white" tabindex="0" onclick="handleItemClick(event, 'b-white')"></div>
        </div>

        <div class="text-container">
            <div class="text-box" id="text-box" tabindex="0" onclick="handleItemClick(event, 'text-box')"></div>
        </div>

        <div class="row">
            <div class="block b-green" id="b-green" tabindex="0" onclick="handleItemClick(event, 'b-green')"></div>
            <div class="block b-black" id="b-black" tabindex="0" onclick="handleItemClick(event, 'b-black')"></div>
            <div class="block b-red" id="b-red" tabindex="0" onclick="handleItemClick(event, 'b-red')"></div>
        </div>

        <div class="controls">
            <div class="btn btn-delete" id="b-delete" tabindex="0" onclick="handleItemClick(event, 'b-delete')">⟵</div>
            <div class="btn btn-space" id="b-space" tabindex="0" onclick="handleItemClick(event, 'b-space')">▬</div>
            <div class="btn btn-accept" id="b-accept" tabindex="0" onclick="handleItemClick(event, 'b-accept')">✔</div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('./pwabuilder-sw.js').catch(()=>console.log('SW error')); });
        }

        const dict = {
            blue:   [{l:'A', c:'c-blue'}, {l:'B', c:'c-yellow'}, {l:'C', c:'c-white'}, {l:'D', c:'c-green'}, {l:'E', c:'c-black'}, {l:'F', c:'c-red'}],
            yellow: [{l:'0', c:'c-blue'}, {l:'1', c:'c-yellow'}, {l:'2', c:'c-white'}, {l:'3', c:'c-green'}, {l:'4', c:'c-black'}, {l:'5', c:'c-red'}],
            white:  [{l:'G', c:'c-blue'}, {l:'H', c:'c-yellow'}, {l:'I', c:'c-white'}, {l:'J', c:'c-green'}, {l:'K', c:'c-black'}, {l:'L', c:'c-red'}],
            green:  [{l:'M', c:'c-blue'}, {l:'N', c:'c-yellow'}, {l:'O', c:'c-white'}, {l:'P', c:'c-green'}, {l:'Q', c:'c-black'}, {l:'R', c:'c-red'}],
            black:  [{l:'6', c:'c-blue'}, {l:'7', c:'c-yellow'}, {l:'8', c:'c-white'}, {l:'9', c:'c-green'}, {l:'Y', c:'c-black'}, {l:'Z', c:'c-red'}],
            red:    [{l:'S', c:'c-blue'}, {l:'T', c:'c-yellow'}, {l:'U', c:'c-white'}, {l:'V', c:'c-green'}, {l:'W', c:'c-black'}, {l:'X', c:'c-red'}]
        };
        const colors = ['blue', 'yellow', 'white', 'green', 'black', 'red'];
        
        let appMode = null; 
        let boardState = 'MAIN'; 
        let activeBlock = null; 
        let inputBlocked = false; 
        let lastClickTime = 0;

        let macros = {};
        let dictionaryLoaded = false;
        let githubFetchFailed = false;
        let currentText = "";
        let currentPrediction = "";
        
        // Diccionario base expandido de +100 palabras comunes (medicina, necesidades y cotidianidad)
        const defaultDict = {
            "QUE":100, "NO":99, "SI":98, "QUIERO":97, "TENGO":96, "DUELE":95, "AGUA":94, "HOLA":93, "BIEN":92, "MAL":91, 
            "GRACIAS":90, "AYUDA":89, "MAS":88, "MENOS":87, "AHORA":86, "LUEGO":85, "HOY":84, "MAÑANA":83, "CALOR":82, 
            "FRIO":81, "CAMA":80, "DORMIR":79, "CANSADO":78, "SENTARSE":77, "LEVANTARSE":76, "COMIDA":75, "BAÑO":74, 
            "TELEVISION":73, "MUSICA":72, "MEDICO":71, "ENFERMERA":70, "PASTILLA":69, "DOLOR":68, "CABEZA":67, 
            "ESTOMAGO":66, "BRAZO":65, "PIERNA":64, "ESPALDA":63, "CUELLO":62, "RESPIRAR":61, "TOS":60, "MOCO":59, 
            "PICOR":58, "RASCAR":57, "GAFAS":56, "ZAPATOS":55, "ROPA":54, "VESTIR":53, "DESVESTIR":52, "LIMPIAR":51, 
            "LAVAR":50, "DUCHA":49, "BOCA":48, "DIENTES":47, "SED":46, "HAMBRE":45, "SUEÑO":44, "MIEDO":43, 
            "ALEGRE":42, "TRISTE":41, "ENFADADO":40, "ABURRIDO":39, "TRANQUILO":38, "NERVIOSO":37, "SIEMPRE":36, 
            "NUNCA":35, "AQUI":34, "ALLI":33, "DONDE":32, "CUANDO":31, "QUIEN":30, "COMO":29, "PORQUE":28, "MUCHO":27, 
            "POCO":26, "TODO":25, "NADA":24, "OTRO":23, "MISMO":22, "BUENO":21, "MALO":20, "GRANDE":19, "PEQUEÑO":18, 
            "CALIENTE":17, "NUEVO":16, "VIEJO":15, "ESPERAR":14, "VENIR":13, "IR":12, "ESTAR":11, "SER":10, "HACER":9, 
            "DECIR":8, "PODER":7, "SABER":6, "POR":5, "FAVOR":4, "ADIOS":3, "FAMILIA":2, "MEDICAMENTO":1
        };

        // Carga frecuencias guardadas o usa el diccionario base
        let wordFrequencies = JSON.parse(localStorage.getItem('comunicador_freqs')) || defaultDict;

        const textBox = document.getElementById('text-box');
        const statusMsg = document.getElementById('status-msg');

        function showStatusMessage(msg, color) {
            statusMsg.style.background = color;
            statusMsg.innerText = msg;
            statusMsg.style.display = 'block';
            setTimeout(() => statusMsg.style.display = 'none', 3000);
        }

        async function attemptStartApp(mode) {
            if (dictionaryLoaded || githubFetchFailed) {
                startApp(mode);
                return;
            }
            try {
                showStatusMessage("Buscando diccionario...", "#f39c12");
                let response = await fetch("diccionario.json");
                if (response.ok) {
                    macros = await response.json();
                    dictionaryLoaded = true;
                    showStatusMessage("Diccionario en la nube cargado ✔", "#27ae60");
                    setTimeout(() => startApp(mode), 1000);
                } else { throw new Error("No encontrado"); }
            } catch (e) {
                githubFetchFailed = true;
                showStatusMessage("No se encontró diccionario. Pulsa de nuevo para entrar.", "#c0392b");
            }
        }

        function loadLocalDictionary(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    macros = JSON.parse(e.target.result);
                    dictionaryLoaded = true;
                    showStatusMessage("Diccionario local cargado ✔", "#27ae60");
                } catch(err) { showStatusMessage("Error al leer archivo", "#c0392b"); }
            };
            reader.readAsText(file);
        }

        function updatePrediction() {
            currentPrediction = "";
            let words = currentText.split(/[\s\u00A0]+/);
            let lastWord = words[words.length - 1].toUpperCase();
            if (lastWord.length >= 2) {
                let bestMatch = ""; let maxFreq = -1;
                for (let word in wordFrequencies) {
                    if (word.startsWith(lastWord) && wordFrequencies[word] > maxFreq) {
                        maxFreq = wordFrequencies[word];
                        bestMatch = word;
                    }
                }
                if (bestMatch && bestMatch !== lastWord) currentPrediction = bestMatch;
            }
        }

        function updateFrequency(word) {
            word = word.toUpperCase().trim();
            if (word.length < 2) return;
            wordFrequencies[word] = (wordFrequencies[word] || 0) + 1;
            localStorage.setItem('comunicador_freqs', JSON.stringify(wordFrequencies));
        }

        function renderText() {
            let displayHTML = currentText;
            if (currentPrediction) {
                let words = currentText.split(/[\s\u00A0]+/);
                let lastWord = words[words.length - 1];
                let remainder = currentPrediction.substring(lastWord.length);
                displayHTML += `<span class="blink-text">${remainder}</span>`;
            }
            textBox.innerHTML = displayHTML;
        }

        function startApp(mode) {
            appMode = mode;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            currentText = "";
            renderText();
            renderMain();
            if (appMode === 'SECUENCIAL') { initCameraSystem(); startScanning(); } 
            else if (appMode === 'TV') { document.getElementById('b-blue').focus(); }
        }

        function renderMain() {
            boardState = 'MAIN'; activeBlock = null; clearHighlights();
            colors.forEach(color => {
                let html = `<table class="letters"><tr>`;
                for(let i=0; i<3; i++) html += `<td class="${dict[color][i].c}">${dict[color][i].l}</td>`;
                html += `</tr><tr>`;
                for(let i=3; i<6; i++) html += `<td class="${dict[color][i].c}">${dict[color][i].l}</td>`;
                html += `</tr></table>`;
                document.getElementById(`b-${color}`).innerHTML = html;
            });
            blockInputBriefly();
            if (appMode === 'TV') document.getElementById('b-blue').focus();
        }

        function renderSub(selectedColor) {
            boardState = 'SUB'; activeBlock = selectedColor; clearHighlights();
            const chars = dict[selectedColor];
            colors.forEach((color, index) => {
                document.getElementById(`b-${color}`).innerHTML = `<span class="single-letter ${chars[index].c}">${chars[index].l}</span>`;
            });
            blockInputBriefly();
            if (appMode === 'TV') document.getElementById('b-blue').focus();
        }

        function blockInputBriefly() { inputBlocked = true; setTimeout(() => { inputBlocked = false; }, 400); }

        function handleItemClick(event, id) {
            if (appMode === 'SECUENCIAL') { event.stopPropagation(); triggerSequentialAction(); return; }
            executeSelection(id);
        }

        document.getElementById('app-container').addEventListener('click', () => { if (appMode === 'SECUENCIAL') triggerSequentialAction(); });

        function executeSelection(id) {
            let now = Date.now();
            if (inputBlocked || (now - lastClickTime < 300)) return;
            lastClickTime = now;

            if (id.startsWith('b-') && id !== 'b-delete' && id !== 'b-space' && id !== 'b-accept') {
                let colorClicked = id.replace('b-', '');
                if (boardState === 'MAIN') { renderSub(colorClicked); } 
                else if (boardState === 'SUB') {
                    const colorIndex = colors.indexOf(colorClicked);
                    currentText += dict[activeBlock][colorIndex].l;
                    updatePrediction(); renderText(); renderMain();
                }
            }
            else if (id === 'text-box') {
                if (currentText !== "") { boardState = 'SPEAK_PENDING'; highlightElement('b-accept'); }
            }
            else if (id === 'b-delete') {
                if (boardState === 'SUB') { renderMain(); } 
                else if (boardState === 'MAIN') { boardState = 'DELETE_PENDING'; highlightElement('b-accept'); } 
                else { resetActions(); }
            }
            else if (id === 'b-space') {
                if (boardState === 'MAIN') { boardState = 'SPACE_PENDING'; highlightElement('b-accept'); } 
                else if (boardState === 'DELETE_PENDING') { boardState = 'CLEAR_PENDING'; highlightElement('b-accept'); }
            }
            else if (id === 'b-accept') { confirmAction(); }
        }

        function highlightElement(elId) { clearHighlights(); document.getElementById(elId).classList.add('highlighted'); if (appMode === 'TV') document.getElementById(elId).focus(); }
        function clearHighlights() { document.querySelectorAll('.highlighted').forEach(el => el.classList.remove('highlighted')); }
        function resetActions() { boardState = 'MAIN'; clearHighlights(); renderMain(); }

        function confirmAction() {
            if (boardState === 'DELETE_PENDING') {
                currentText = currentText.slice(0, -1);
                updatePrediction();
            } 
            else if (boardState === 'CLEAR_PENDING') {
                currentText = ""; currentPrediction = "";
            } 
            else if (boardState === 'SPACE_PENDING') {
                let words = currentText.split(/[\s\u00A0]+/);
                let lastWord = words[words.length - 1];
                let upperLast = lastWord.toUpperCase();

                if (macros[upperLast]) {
                    currentText = currentText.substring(0, currentText.length - lastWord.length) + macros[upperLast];
                    currentPrediction = "";
                } 
                else if (currentPrediction) {
                    currentText = currentText.substring(0, currentText.length - lastWord.length) + currentPrediction;
                    updateFrequency(currentPrediction);
                    currentPrediction = "";
                } 
                else {
                    if (lastWord.trim().length >= 2) updateFrequency(lastWord.trim());
                }
                currentText += "\u00A0"; 
                updatePrediction();
            } 
            else if (boardState === 'SPEAK_PENDING') {
                if ('speechSynthesis' in window && currentText.trim() !== "") {
                    window.speechSynthesis.cancel();
                    const textoParaLeer = currentText.replace(/\u00A0/g, " ");
                    const locucion = new SpeechSynthesisUtterance(textoParaLeer);
                    locucion.lang = 'es-ES'; window.speechSynthesis.speak(locucion);
                }
            }
            renderText(); resetActions();
        }

        document.addEventListener('keydown', function(event) {
            if (appMode === null || appMode === 'TV' || appMode === 'MANUAL') {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    const activeElement = document.activeElement;
                    if (activeElement && activeElement.hasAttribute('tabindex')) activeElement.click();
                }
            }
            if (appMode === 'SECUENCIAL' && event.code === 'Space') { event.preventDefault(); triggerSequentialAction(); }
        });

        let scanIndex = 0; let scanList = []; let scanInterval = 1000; let scanTimer = null;

        function getActiveScanList() {
            if (boardState === 'MAIN') return ['b-blue', 'b-yellow', 'b-white', 'b-green', 'b-black', 'b-red', 'b-delete', 'b-space', 'text-box'];
            else if (boardState === 'SUB') return ['b-blue', 'b-yellow', 'b-white', 'b-green', 'b-black', 'b-red', 'b-delete'];
            else if (boardState === 'DELETE_PENDING') return ['b-accept', 'b-space', 'b-delete'];
            else if (boardState === 'CLEAR_PENDING' || boardState === 'SPACE_PENDING' || boardState === 'SPEAK_PENDING') return ['b-accept', 'b-delete'];
            return [];
        }

        function startScanning() {
            clearInterval(scanTimer); scanIndex = 0;
            scanTimer = setInterval(() => {
                scanList = getActiveScanList();
                if (scanList.length === 0) return;
                document.querySelectorAll('.scanning-active').forEach(el => el.classList.remove('scanning-active'));
                scanIndex = scanIndex % scanList.length;
                document.getElementById(scanList[scanIndex]).classList.add('scanning-active');
                scanIndex++;
            }, scanInterval);
        }

        function triggerSequentialAction() {
            if (inputBlocked) return;
            scanList = getActiveScanList();
            if (scanList.length === 0) return;
            let targetedIndex = (scanIndex - 1 + scanList.length) % scanList.length;
            executeSelection(scanList[targetedIndex]);
            startScanning(); 
        }

        const videoElement = document.getElementById('webcam-video');
        let lastTriggerTime = 0;
        function triggerActionWithDebounce() {
            let now = Date.now();
            if (now - lastTriggerTime > 1200) { lastTriggerTime = now; triggerSequentialAction(); }
        }

        function onResults(results) {
            if (appMode !== 'SECUENCIAL') return;
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
            let upperLip = results.multiFaceLandmarks[0][13];
            let lowerLip = results.multiFaceLandmarks[0][14];
            let mouthOpenDist = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);
            if (mouthOpenDist > 0.08) triggerActionWithDebounce();
        }

        async function initCameraSystem() {
            try {
                showStatusMessage("Iniciando cámara...", "#f39c12");
                const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
                faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
                faceMesh.onResults(onResults);
                const camera = new Camera(videoElement, { onFrame: async () => { await faceMesh.send({image: videoElement}); }, width: 640, height: 480 });
                await camera.start();
                showStatusMessage("¡Cámara activada! Abre la boca para seleccionar.", "#27ae60");
            } catch (error) {
                showStatusMessage("Cámara no disponible (Usa toque o barra espaciadora)", "#c0392b");
            }
        }
    </script>
</body>
