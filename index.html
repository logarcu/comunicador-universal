<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Forzar color de esquema claro para anular el modo oscuro del móvil -->
    <meta name="color-scheme" content="only light">
    <title>Comunicador</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0f0f0">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; user-select: none; }
        
        /* FORZAR FONDO CLARO ABSOLUTO */
        html, body { 
            margin: 0; padding: 0; height: 100vh; height: 100dvh; 
            background-color: #f0f0f0 !important; color: #000000 !important;
            overflow: hidden; color-scheme: light;
        }

        #main-menu {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            height: 100%; width: 100%; gap: 4vh; padding: 4vh 4vw;
            background-color: #f0f0f0 !important;
        }

        .menu-btn {
            flex: 1; width: 100%; max-width: 800px;
            background: #ffffff !important; border: 6px solid #333 !important; border-radius: 25px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 6vh; font-weight: bold; color: #333 !important; cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); transition: transform 0.2s, background 0.3s;
            text-align: center;
        }
        .menu-btn span { font-size: 3vh; font-weight: normal; color: #666 !important; margin-top: 1vh; }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn:focus { 
            outline: 8px solid #00AAFF; transform: scale(1.02); 
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.6);
        }

        #app-container {
            display: none; 
            flex-direction: column; justify-content: space-between;
            height: 100vh; height: 100dvh; width: 100%; padding: 1vh 2vw;
            background-color: #f0f0f0 !important;
            cursor: pointer;
        }

        .row { 
            display: flex; justify-content: space-evenly; align-items: center; 
            width: 100%; gap: 2vw; flex: 1; max-height: 27vh;
        }
        
        .block { 
            border-width: 1.2vmin; border-style: solid; border-radius: 16px; 
            width: 29vmin; height: 29vmin; background-color: #ffffff !important; 
            display: flex; align-items: center; justify-content: center; 
            padding: 2px; position: relative; overflow: hidden; flex-shrink: 0; 
            transition: transform 0.2s, background-color 0.3s, outline 0.1s;
        }
        
        .block:focus, .btn:focus, .text-box:focus {
            outline: 6px solid #00AAFF; transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.6);
        }
        .block:active { transform: scale(0.95); }

        .b-blue { border-color: #0033CC !important; }
        .b-yellow { border-color: #CCCC00 !important; }
        .b-white { border-color: #888888 !important; box-shadow: 0 0 0 3px #000, inset 0 0 0 3px #000; } 
        .b-green { border-color: #008000 !important; }
        .b-black { border-color: #000000 !important; }
        .b-red { border-color: #CC0000 !important; }

        .c-blue { color: #0033CC !important; }
        .c-yellow { color: #999900 !important; text-shadow: 1px 1px 1px #fff; }
        .c-white { color: #555555 !important; text-shadow: 1px 1px 1px #fff; }
        .c-green { color: #008000 !important; }
        .c-black { color: #000000 !important; }
        .c-red { color: #CC0000 !important; }

        .letters { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; pointer-events: none; }
        .letters td { font-size: 7.5vmin; line-height: 1; font-weight: bold; text-align: center; vertical-align: middle; }
        .single-letter { font-size: 18vmin; font-weight: bold; pointer-events: none; }

        .text-container {
            display: flex; justify-content: center; align-items: center;
            height: 9vh; width: 100%; margin: 0.5vh 0; flex-shrink: 0;
        }
        .text-box {
            width: 90%; height: 100%; font-size: 5vh; padding: 0 20px;
            border: 3px solid #333 !important; border-radius: 12px; 
            background: #ffffff !important; color: #000000 !important;
            display: flex; align-items: center; justify-content: flex-end;
            overflow: hidden; white-space: pre; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.1); transition: all 0.3s;
        }
        
        .controls { 
            display: flex; justify-content: space-evenly; gap: 2vw; 
            height: 11vh; width: 100%; flex-shrink: 0; margin-bottom: 0.5vh;
        }
        .btn {
            flex: 1; border: 3px solid #333 !important; border-radius: 12px; 
            background: #ffffff !important; color: #000000 !important;
            display: flex; justify-content: center; align-items: center; font-size: 6.5vh;
            cursor: pointer; transition: all 0.3s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-delete { color: #CC0000 !important; }
        .btn-space { color: #000000 !important; }
        .btn-accept { color: #008000 !important; font-weight: bold; }

        .scanning-active {
            background-color: #ffeb3b !important; border-color: #ff9800 !important;
            transform: scale(1.02); box-shadow: 0 0 15px rgba(255, 152, 0, 0.8);
        }
        .highlighted { background-color: #ffeb3b !important; border-color: #ff9800 !important; }

        #status-msg {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            background: #222; color: #fff; padding: 8px 15px; border-radius: 8px;
            font-size: 14px; z-index: 9999; text-align: center; font-weight: bold;
        }
        #webcam-video { display: none; }

        /* BLINDAJE CONTRA EL MODO OSCURO DEL SISTEMA ANDROID */
        @media (prefers-color-scheme: dark) {
            html, body, #main-menu, #app-container { background-color: #f0f0f0 !important; color: #000000 !important; }
            .block, .menu-btn, .text-box, .btn { background-color: #ffffff !important; color: #000000 !important; border-color: #333333 !important; }
            .b-blue { border-color: #0033CC !important; }
            .b-yellow { border-color: #CCCC00 !important; }
            .b-white { border-color: #888888 !important; }
            .b-green { border-color: #008000 !important; }
            .b-black { border-color: #000000 !important; }
            .b-red { border-color: #CC0000 !important; }
            .btn-delete { color: #CC0000 !important; }
            .btn-space { color: #000000 !important; }
            .btn-accept { color: #008000 !important; }
            .menu-btn span { color: #666666 !important; }
        }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL DE SELECCIÓN -->
    <div id="main-menu">
        <div class="menu-btn" tabindex="0" onclick="startApp('MANUAL')">
            Modo MANUAL
            <span>(Tocar pantalla o Ratón)</span>
        </div>
        <div class="menu-btn" tabindex="0" onclick="startApp('SECUENCIAL')">
            Modo SECUENCIAL
            <span>(Cámara o Pulsador global)</span>
        </div>
        <div class="menu-btn" tabindex="0" onclick="startApp('TV')">
            Modo TELEVISIÓN
            <span>(Mando a distancia con flechas)</span>
        </div>
    </div>

    <!-- CONTENEDOR DEL COMUNICADOR -->
    <div id="app-container">
        <div id="status-msg" style="display:none;"></div>
        <video id="webcam-video" autoplay playsinline></video>

        <div class="row">
            <div class="block b-blue" id="b-blue" tabindex="0" onclick="handleItemClick(event, 'b-blue')"></div>
            <div class="block b-yellow" id="b-yellow" tabindex="0" onclick="handleItemClick(event, 'b-yellow')"></div>
            <div class="block b-white" id="b-white" tabindex="0" onclick="handleItemClick(event, 'b-white')"></div>
        </div>

        <div class="text-container">
            <div class="text-box" id="text-box" tabindex="0" onclick="handleItemClick(event, 'text-box')"></div>
        </div>

        <div class="row">
            <div class="block b-green" id="b-green" tabindex="0" onclick="handleItemClick(event, 'b-green')"></div>
            <div class="block b-black" id="b-black" tabindex="0" onclick="handleItemClick(event, 'b-black')"></div>
            <div class="block b-red" id="b-red" tabindex="0" onclick="handleItemClick(event, 'b-red')"></div>
        </div>

        <div class="controls">
            <div class="btn btn-delete" id="b-delete" tabindex="0" onclick="handleItemClick(event, 'b-delete')">⟵</div>
            <div class="btn btn-space" id="b-space" tabindex="0" onclick="handleItemClick(event, 'b-space')">▬</div>
            <div class="btn btn-accept" id="b-accept" tabindex="0" onclick="handleItemClick(event, 'b-accept')">✔</div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./pwabuilder-sw.js').catch(err => console.log('SW error:', err));
            });
        }

        const dict = {
            blue:   [{l:'A', c:'c-blue'}, {l:'B', c:'c-yellow'}, {l:'C', c:'c-white'}, {l:'D', c:'c-green'}, {l:'E', c:'c-black'}, {l:'F', c:'c-red'}],
            yellow: [{l:'0', c:'c-blue'}, {l:'1', c:'c-yellow'}, {l:'2', c:'c-white'}, {l:'3', c:'c-green'}, {l:'4', c:'c-black'}, {l:'5', c:'c-red'}],
            white:  [{l:'G', c:'c-blue'}, {l:'H', c:'c-yellow'}, {l:'I', c:'c-white'}, {l:'J', c:'c-green'}, {l:'K', c:'c-black'}, {l:'L', c:'c-red'}],
            green:  [{l:'M', c:'c-blue'}, {l:'N', c:'c-yellow'}, {l:'O', c:'c-white'}, {l:'P', c:'c-green'}, {l:'Q', c:'c-black'}, {l:'R', c:'c-red'}],
            black:  [{l:'6', c:'c-blue'}, {l:'7', c:'c-yellow'}, {l:'8', c:'c-white'}, {l:'9', c:'c-green'}, {l:'Y', c:'c-black'}, {l:'Z', c:'c-red'}],
            red:    [{l:'S', c:'c-blue'}, {l:'T', c:'c-yellow'}, {l:'U', c:'c-white'}, {l:'V', c:'c-green'}, {l:'W', c:'c-black'}, {l:'X', c:'c-red'}]
        };

        const colors = ['blue', 'yellow', 'white', 'green', 'black', 'red'];
        
        let appMode = null; 
        let boardState = 'MAIN'; 
        let activeBlock = null; 
        let actionState = 'IDLE'; 
        let inputBlocked = false; 
        let lastClickTime = 0; // Filtro anti-rebote para el mando de la TV

        const textBox = document.getElementById('text-box');
        const statusMsg = document.getElementById('status-msg');

        function startApp(mode) {
            appMode = mode;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            
            renderMain();

            if (appMode === 'SECUENCIAL') {
                document.getElementById('status-msg').style.display = 'block';
                initCameraSystem();
                startScanning();
            } else if (appMode === 'TV') {
                document.getElementById('b-blue').focus();
            }
        }

        function renderMain() {
            boardState = 'MAIN';
            activeBlock = null;
            clearHighlights();
            colors.forEach(color => {
                let html = `<table class="letters"><tr>`;
                for(let i=0; i<3; i++) html += `<td class="${dict[color][i].c}">${dict[color][i].l}</td>`;
                html += `</tr><tr>`;
                for(let i=3; i<6; i++) html += `<td class="${dict[color][i].c}">${dict[color][i].l}</td>`;
                html += `</tr></table>`;
                document.getElementById(`b-${color}`).innerHTML = html;
            });
            blockInputBriefly();
            if (appMode === 'TV') document.getElementById('b-blue').focus();
        }

        function renderSub(selectedColor) {
            boardState = 'SUB';
            activeBlock = selectedColor;
            clearHighlights();
            const chars = dict[selectedColor];
            colors.forEach((color, index) => {
                document.getElementById(`b-${color}`).innerHTML = `<span class="single-letter ${chars[index].c}">${chars[index].l}</span>`;
            });
            blockInputBriefly();
            if (appMode === 'TV') document.getElementById('b-blue').focus();
        }

        function blockInputBriefly() {
            inputBlocked = true;
            setTimeout(() => { inputBlocked = false; }, 400);
        }

        function handleItemClick(event, id) {
            if (appMode === 'SECUENCIAL') {
                event.stopPropagation();
                triggerSequentialAction();
                return;
            }
            executeSelection(id);
        }

        document.getElementById('app-container').addEventListener('click', () => {
            if (appMode === 'SECUENCIAL') triggerSequentialAction();
        });

        function executeSelection(id) {
            let now = Date.now();
            // Evitar clics dobles del mando (rebote) con un margen de 300 milisegundos
            if (inputBlocked || (now - lastClickTime < 300)) return;
            lastClickTime = now;

            if (id.startsWith('b-') && id !== 'b-delete' && id !== 'b-space' && id !== 'b-accept') {
                let colorClicked = id.replace('b-', '');
                if (boardState === 'MAIN') {
                    renderSub(colorClicked);
                } else if (boardState === 'SUB') {
                    const colorIndex = colors.indexOf(colorClicked);
                    textBox.innerText += dict[activeBlock][colorIndex].l;
                    renderMain();
                }
            }
            else if (id === 'text-box') {
                if (textBox.innerText !== "") {
                    boardState = 'SPEAK_PENDING';
                    highlightElement('b-accept');
                }
            }
            else if (id === 'b-delete') {
                if (boardState === 'SUB') {
                    renderMain(); 
                } 
                else if (boardState === 'MAIN') {
                    boardState = 'DELETE_PENDING';
                    highlightElement('b-accept');
                } 
                else {
                    resetActions();
                }
            }
            else if (id === 'b-space') {
                if (boardState === 'MAIN') {
                    boardState = 'SPACE_PENDING';
                    highlightElement('b-accept');
                } 
                else if (boardState === 'DELETE_PENDING') {
                    boardState = 'CLEAR_PENDING';
                    highlightElement('b-accept');
                }
            }
            else if (id === 'b-accept') {
                confirmAction();
            }
        }

        function highlightElement(elId) {
            clearHighlights();
            document.getElementById(elId).classList.add('highlighted');
            if (appMode === 'TV') document.getElementById(elId).focus();
        }

        function clearHighlights() {
            document.querySelectorAll('.highlighted').forEach(el => el.classList.remove('highlighted'));
        }

        function resetActions() {
            boardState = 'MAIN';
            clearHighlights();
            renderMain();
        }

        function confirmAction() {
            if (boardState === 'DELETE_PENDING') {
                textBox.innerText = textBox.innerText.slice(0, -1);
            } 
            else if (boardState === 'CLEAR_PENDING') {
                textBox.innerText = "";
            } 
            else if (boardState === 'SPACE_PENDING') {
                textBox.innerText += "\u00A0"; 
            } 
            else if (boardState === 'SPEAK_PENDING') {
                if ('speechSynthesis' in window && textBox.innerText.trim() !== "") {
                    window.speechSynthesis.cancel();
                    const textoParaLeer = textBox.innerText.replace(/\u00A0/g, " ");
                    const locucion = new SpeechSynthesisUtterance(textoParaLeer);
                    locucion.lang = 'es-ES'; 
                    window.speechSynthesis.speak(locucion);
                }
            }
            resetActions();
        }

        document.addEventListener('keydown', function(event) {
            if (appMode === null || appMode === 'TV' || appMode === 'MANUAL') {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    const activeElement = document.activeElement;
                    if (activeElement && activeElement.hasAttribute('tabindex')) {
                        activeElement.click();
                    }
                }
            }
            if (appMode === 'SECUENCIAL' && event.code === 'Space') {
                event.preventDefault(); 
                triggerSequentialAction();
            }
        });

        let scanIndex = 0;
        let scanList = [];
        let scanInterval = 1000; 
        let scanTimer = null;

        function getActiveScanList() {
            if (boardState === 'MAIN') return ['b-blue', 'b-yellow', 'b-white', 'b-green', 'b-black', 'b-red', 'b-delete', 'b-space', 'text-box'];
            else if (boardState === 'SUB') return ['b-blue', 'b-yellow', 'b-white', 'b-green', 'b-black', 'b-red', 'b-delete'];
            else if (boardState === 'DELETE_PENDING') return ['b-accept', 'b-space', 'b-delete'];
            else if (boardState === 'CLEAR_PENDING') return ['b-accept', 'b-delete'];
            else if (boardState === 'SPACE_PENDING' || boardState === 'SPEAK_PENDING') return ['b-accept', 'b-delete'];
            return [];
        }

        function startScanning() {
            clearInterval(scanTimer);
            scanIndex = 0;
            scanTimer = setInterval(() => {
                scanList = getActiveScanList();
                if (scanList.length === 0) return;
                document.querySelectorAll('.scanning-active').forEach(el => el.classList.remove('scanning-active'));
                scanIndex = scanIndex % scanList.length;
                let currentId = scanList[scanIndex];
                document.getElementById(currentId).classList.add('scanning-active');
                scanIndex++;
            }, scanInterval);
        }

        function triggerSequentialAction() {
            if (inputBlocked) return;
            scanList = getActiveScanList();
            if (scanList.length === 0) return;
            let targetedIndex = (scanIndex - 1 + scanList.length) % scanList.length;
            let selectedId = scanList[targetedIndex];
            executeSelection(selectedId);
            startScanning(); 
        }

        const videoElement = document.getElementById('webcam-video');
        let lastTriggerTime = 0;

        function triggerActionWithDebounce() {
            let now = Date.now();
            if (now - lastTriggerTime > 1200) { 
                lastTriggerTime = now;
                triggerSequentialAction();
            }
        }

        function onResults(results) {
            if (appMode !== 'SECUENCIAL') return;
            if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
            let upperLip = results.multiFaceLandmarks[0][13];
            let lowerLip = results.multiFaceLandmarks[0][14];
            let mouthOpenDist = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);
            if (mouthOpenDist > 0.08) {
                triggerActionWithDebounce();
            }
        }

        async function initCameraSystem() {
            try {
                const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
                faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
                faceMesh.onResults(onResults);
                const camera = new Camera(videoElement, {
                    onFrame: async () => { await faceMesh.send({image: videoElement}); },
                    width: 640, height: 480
                });
                await camera.start();
                statusMsg.style.background = '#008000';
                statusMsg.innerText = "¡Cámara activada! Abre la boca para seleccionar.";
                setTimeout(() => statusMsg.style.display = 'none', 3000);
            } catch (error) {
                statusMsg.style.background = '#d9534f';
                statusMsg.innerText = "Cámara no disponible (Usa toque o barra espaciadora)";
                setTimeout(() => statusMsg.style.display = 'none', 4000);
            }
        }
    </script>
</body>
</html>
